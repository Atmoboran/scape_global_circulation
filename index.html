<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Windgürtel der Erde</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="windguertel"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <nav class="nav" data-t-aria="nav.aria">
      <a href="#sonne" data-part="sonne"><span class="num">1</span><span data-t="nav.sonne"></span></a>
      <a href="#coriolis" data-part="coriolis"><span class="num">2</span><span data-t="nav.coriolis"></span></a>
      <a href="#zirkulation" data-part="zirkulation"><span class="num">3</span><span data-t="nav.zirkulation"></span></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <!-- small solid shape, one per part -->
  <svg class="l2" data-part-shape="sonne" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="26" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <line x1="60" y1="6" x2="60" y2="20"/><line x1="60" y1="100" x2="60" y2="114"/>
      <line x1="6" y1="60" x2="20" y2="60"/><line x1="100" y1="60" x2="114" y2="60"/>
      <line x1="22" y1="22" x2="32" y2="32"/><line x1="88" y1="88" x2="98" y2="98"/>
      <line x1="22" y1="98" x2="32" y2="88"/><line x1="88" y1="32" x2="98" y2="22"/>
    </g>
  </svg>
  <svg class="l2" data-part-shape="coriolis" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="10" fill="currentColor"/>
    <path d="M60,60 C72,48 92,50 100,70" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    <path d="M88,74 L101,72 L105,59" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="1 12" stroke-linecap="round"/>
  </svg>
  <svg class="l2" data-part-shape="zirkulation" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60,8 A52,52 0 0 1 60,112 Z" fill="currentColor"/>
    <path d="M60,8 A52,52 0 0 0 60,112" fill="none" stroke="currentColor" stroke-width="6"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="180"/>
    <path d="M20,200 H380 M44,110 H356 M44,290 H356 M110,44 H290 M110,356 H290"/>
  </svg>
  <div class="poster-text">
    <p class="kicker" id="kicker"></p>
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" id="lead"></p>
  </div>
</div>

<main class="page">

  <!-- ================= TEIL 1: DIE SONNE ================= -->
  <section class="part" id="part-sonne" data-part="sonne" hidden>
    <h2 class="sr-only" data-t="sun.title"></h2>
    <div class="lab">
      <div class="lab-pre">
        <div class="howto">
          <p class="text" data-t-html="sun.howto"></p>
          <button type="button" class="info" aria-controls="sun-howto" data-t-aria="common.howtoAria"></button>
        </div>
        <div class="info-note" id="sun-howto" hidden><div data-t-html="sun.howtoNote"></div><p data-t="common.zoom"></p></div>
      </div>
      <div class="lab-stage">
        <div class="stage-frame zoom-frame" id="sun-frame">
          <canvas role="img" data-t-aria="sun.stageAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <div class="range">
          <label for="lat-slider" data-t="sun.sliderLabel"></label>
          <input type="range" id="lat-slider" min="20" max="70" step="1" value="50">
          <output for="lat-slider" id="lat-value" class="c-b"></output>
        </div>
        <div class="seg presets" id="sun-presets" role="group" data-t-aria="sun.presetsAria">
          <button type="button" class="btn" data-lat="23" data-t="sun.presetSahara"></button>
          <button type="button" class="btn" data-lat="50" data-t="sun.presetHome"></button>
          <button type="button" class="btn" data-lat="70" data-t="sun.presetNordkap"></button>
        </div>
        <p class="result" id="sun-result" aria-live="polite"></p>
        <p class="hint" data-t="sun.hint"></p>

        <div class="tasks" id="sun-tasks">
          <h3 data-t="common.tasks"></h3>
          <ul>
            <li data-task="half"><span class="box"></span><span data-t="sun.tasks.half"></span></li>
            <li data-task="trip"><span class="box"></span><span data-t="sun.tasks.trip"></span></li>
          </ul>
        </div>
        <div class="merke locked" data-for="sun-tasks">
          <h3 data-t="common.merke"></h3>
          <p data-t="sun.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>

    <div class="topics">
      <details class="topic"><summary data-t="sun.topics.what.title"></summary><div class="topic-body" data-t-html="sun.topics.what.body"></div></details>
      <details class="topic"><summary data-t="sun.topics.intro.title"></summary><div class="topic-body" data-t-html="sun.topics.intro.body"></div></details>
    </div>
    <div class="next-part"><a class="btn" href="#coriolis" data-t="sun.next"></a></div>
  </section>

  <!-- ================= TEIL 2: DIE ERDDREHUNG ================= -->
  <section class="part" id="part-coriolis" data-part="coriolis" hidden>
    <h2 class="sr-only" data-t="cor.title"></h2>
    <div class="lab">
      <div class="lab-pre">
        <div class="howto">
          <p class="text" data-t-html="cor.howto"></p>
          <button type="button" class="info" aria-controls="cor-howto" data-t-aria="common.howtoAria"></button>
        </div>
        <div class="info-note" id="cor-howto" hidden><div data-t-html="cor.howtoNote"></div><p data-t="common.zoom"></p></div>
        <div class="section-label" data-t="cor.modeLabel"></div>
        <div class="seg" id="cor-mode">
          <button type="button" class="btn" data-value="karussell" aria-pressed="true" data-t="cor.modeCarousel"></button>
          <button type="button" class="btn" data-value="erde" aria-pressed="false" data-t="cor.modeEarth"></button>
        </div>
      </div>
      <div class="lab-stage">
        <div class="stage-frame zoom-frame" id="cor-frame">
          <canvas role="img" data-t-aria="cor.stageAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <button type="button" class="btn big primary throw" id="cor-throw">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
          <span id="cor-throw-label" data-t="cor.throwBall"></span>
        </button>
        <div id="cor-earthdir-row" hidden>
          <div class="section-label" data-t="cor.earthDirLabel"></div>
          <div class="seg" id="cor-earthdir">
            <button type="button" class="btn" data-value="aequator" aria-pressed="true" data-t="cor.toEquator"></button>
            <button type="button" class="btn" data-value="pol" aria-pressed="false" data-t="cor.toPole"></button>
          </div>
        </div>
        <div class="range">
          <label for="cor-speed" data-t="cor.speedLabel"></label>
          <input type="range" id="cor-speed" min="0" max="10" step="1" value="5">
        </div>
        <p class="speed-value" id="cor-speed-value" aria-live="polite"></p>
        <div class="section-label" id="cor-dir-label" data-t="cor.dirLabel"></div>
        <div class="seg" id="cor-hemi">
          <button type="button" class="btn" data-value="1" aria-pressed="true" data-t="cor.ccw"></button>
          <button type="button" class="btn" data-value="-1" aria-pressed="false" data-t="cor.cw"></button>
        </div>
        <p class="result" id="cor-result" aria-live="polite"></p>
        <p class="hint" data-t="cor.hint"></p>

        <div class="tasks" id="cor-tasks">
          <h3 data-t="common.tasks"></h3>
          <ul>
            <li data-task="miss"><span class="box"></span><span data-t="cor.tasks.miss"></span></li>
            <li data-task="still"><span class="box"></span><span data-t="cor.tasks.still"></span></li>
            <li data-task="earth"><span class="box"></span><span data-t="cor.tasks.earth"></span></li>
          </ul>
        </div>
        <div class="merke locked" data-for="cor-tasks">
          <h3 data-t="common.merke"></h3>
          <p data-t="cor.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>

    <div class="topics">
      <details class="topic"><summary data-t="cor.topics.what.title"></summary><div class="topic-body" data-t-html="cor.topics.what.body"></div></details>
    </div>
    <div class="next-part"><a class="btn" href="#zirkulation" data-t="cor.next"></a></div>
  </section>

  <!-- ================= TEIL 3: ALLES ZUSAMMEN ================= -->
  <section class="part" id="part-zirkulation" data-part="zirkulation" hidden>
    <h2 class="sr-only" data-t="circ.title"></h2>
    <div class="lab">
      <div class="lab-pre">
        <div class="howto">
          <p class="text" data-t-html="circ.howto"></p>
          <button type="button" class="info" aria-controls="circ-howto" data-t-aria="common.howtoAria"></button>
        </div>
        <div class="info-note" id="circ-howto" hidden><div data-t-html="circ.howtoNote"></div><p data-t="common.zoom"></p></div>
        <ol class="stepper" id="circ-steps" data-t-aria="circ.stepsAria">
          <li><button type="button" data-t="circ.steps.0"></button></li>
          <li><button type="button" data-t="circ.steps.1"></button></li>
          <li><button type="button" data-t="circ.steps.2"></button></li>
          <li><button type="button" data-t="circ.steps.3"></button></li>
          <li><button type="button" data-t="circ.steps.4"></button></li>
        </ol>
      </div>
      <div class="lab-stage">
        <div class="stage-frame square fit zoom-frame" id="circ-frame">
          <canvas role="img" data-t-aria="circ.stageAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <div class="step-nav">
          <button type="button" class="btn" id="circ-prev" data-t="circ.prev"></button>
          <span id="circ-counter" class="step-counter"></span>
          <button type="button" class="btn primary" id="circ-next" data-t="circ.next"></button>
        </div>

        <div id="circ-captions" aria-live="polite">
          <div class="step-caption"><h3 data-t="circ.captions.0.title"></h3><div data-t-html="circ.captions.0.body"></div></div>
          <div class="step-caption" hidden><h3 data-t="circ.captions.1.title"></h3><div data-t-html="circ.captions.1.body"></div></div>
          <div class="step-caption" hidden><h3 data-t="circ.captions.2.title"></h3><div data-t-html="circ.captions.2.body"></div></div>
          <div class="step-caption" hidden><h3 data-t="circ.captions.3.title"></h3><div data-t-html="circ.captions.3.body"></div></div>
          <div class="step-caption" hidden><h3 data-t="circ.captions.4.title"></h3><div data-t-html="circ.captions.4.body"></div></div>
        </div>
        <p class="hint" data-t="circ.hint"></p>

        <div class="legend">
          <h3 data-t="circ.legend.title"></h3>
          <ul class="legend-list">
            <li><span class="sw hadley"></span><span data-t-html="circ.legend.hadley"></span></li>
            <li><span class="sw ferrel"></span><span data-t-html="circ.legend.ferrel"></span></li>
            <li><span class="sw polar"></span><span data-t-html="circ.legend.polar"></span></li>
            <li><span class="pk low" data-t="circ.canvas.low"></span><span data-t-html="circ.legend.low"></span></li>
            <li><span class="pk high" data-t="circ.canvas.high"></span><span data-t-html="circ.legend.high"></span></li>
            <li><span class="arrow-key" aria-hidden="true"><svg viewBox="0 0 30 18"><path d="M3,9 H20 M14,3 L23,9 L14,15"/></svg></span><span data-t-html="circ.legend.arrows"></span></li>
            <li><span class="dot-key" aria-hidden="true"></span><span data-t-html="circ.legend.dots"></span></li>
          </ul>
        </div>

        <div class="tasks" id="circ-tasks">
          <h3 data-t="common.tasks"></h3>
          <ul>
            <li data-task="steps"><span class="box"></span><span data-t="circ.tasks.steps"></span></li>
            <li data-task="quiz"><span class="box"></span>
              <div>
                <span data-t="circ.tasks.quiz"></span>
                <div class="quiz" id="circ-quiz" role="group" data-t-aria="circ.tasks.quizAria">
                  <button type="button" class="btn" data-answer="passat" data-t="circ.tasks.answers.passat"></button>
                  <button type="button" class="btn" data-answer="west" data-t="circ.tasks.answers.west"></button>
                  <button type="button" class="btn" data-answer="polar" data-t="circ.tasks.answers.polar"></button>
                </div>
                <p class="quiz-feedback" id="circ-quiz-feedback" aria-live="polite"></p>
              </div>
            </li>
          </ul>
        </div>
        <div class="merke locked" data-for="circ-tasks">
          <h3 data-t="common.merke"></h3>
          <p data-t="circ.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>

    <div class="topics">
      <details class="topic"><summary data-t="circ.topics.model.title"></summary><div class="topic-body" data-t-html="circ.topics.model.body"></div></details>
    </div>
    <div class="next-part"><a class="btn" href="#sonne" data-t="circ.again"></a></div>
  </section>
</main>

<footer class="foot">
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/common.js"></script>
<script src="js/sim-sun.js"></script>
<script src="js/sim-coriolis.js"></script>
<script src="js/sim-circulation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
